name: Release NPM package
on:
  push:
    branches:
      - release

jobs:
  get-version:
    name: Get release version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      next-version: ${{ steps.get-release-version.outputs.version }}
      next-version-name: ${{ steps.get-release-version.outputs.version-name }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: wemogy/get-release-version-action@32b677e3cfaf892cf69cd32ddf7bf846142d857f # v4.3.2
        id: get-release-version
        with:
          mode: semantic
          create-tag: true
          prefix: v
          git-username: wemogy IT
          git-email: it@wemogy.com

  build:
    name: Build and pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - get-version
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node
        uses: ./.github/actions/setup-node
        with:
          packages-token: ${{ secrets.WEMOGY_PACKAGES_TOKEN }}

      - name: Update package version
        run: pnpm -r exec pnpm version ${{ needs.get-version.outputs.next-version }} --no-git-tag-version --allow-same-version

      - name: Build library
        run: pnpm build

      - name: Pack package
        run: pnpm --filter @wemogy/better-auth-cosmos pack --pack-destination ${{ github.workspace }}/artifacts

      - name: Upload package tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-tarball
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish-github:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs:
      - build
    steps:
      - name: Download package tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-tarball
          path: artifacts

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com/

      - name: Publish to GitHub Packages
        run: npm publish artifacts/*.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs:
      - build
    steps:
      - name: Download package tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-tarball
          path: artifacts

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Publish to npm
        run: npm publish artifacts/*.tgz --access public --provenance

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - get-version
      - publish-github
      - publish-npm
    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.get-version.outputs.next-version-name }}
          name: Version ${{ needs.get-version.outputs.next-version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
